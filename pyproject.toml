[project]
name = "token-keeper"
version = "0.1.0"
description = "Keeps third-party account connections alive and reports their state to a main app."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are what gets bundled into Lambda. boto3 is provided by the
# Lambda runtime, so it lives in the dev group for local use and tests.
dependencies = [
    "aws-lambda-powertools>=3.41.0",
    "httpx>=0.28.1",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "boto3>=1.35",
    "boto3-stubs[dynamodb,kms,sqs,ssm]>=1.35",
    "moto[dynamodb,kms,server,sqs,ssm]>=5.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "standardwebhooks>=1.0",
    "aws-cdk-lib>=2.170",
    "constructs>=10.4",
    "pytest-timeout>=2.3",
    "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_keeper", "receiver", "local", "infra"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build", "cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # fake secrets in tests
"local/**" = ["S104"]

[tool.mypy]
python_version = "3.12"
files = ["src", "receiver", "local", "infra", "tests", "scripts"]
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["moto.*", "standardwebhooks.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "local.*", "infra.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# A hang should fail with a stack trace, not stall CI.
timeout = 60
